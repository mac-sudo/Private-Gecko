plugins { id 'com.android.application' }

android {
    namespace 'ru.drtrip.maxprivategecko'
    compileSdk 37
    defaultConfig {
        applicationId 'ru.drtrip.maxprivategecko.privatemediatest'
        minSdk 28
        targetSdk 36
        ndk {
    abiFilters 'arm64-v8a'
}
        versionCode 3
        versionName '0.9.0-beta.1'
    }
    buildTypes {
        release {
            minifyEnabled false
            debuggable false
            buildConfigField 'boolean', 'INTERNAL_AUDIT', 'false'
        }
        verification {
            initWith release
            applicationIdSuffix '.hardeningcheck'
            versionNameSuffix '-verification'
            buildConfigField 'boolean', 'INTERNAL_AUDIT', 'true'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
        debug {
            applicationIdSuffix '.hardeningdebug'
            buildConfigField 'boolean', 'INTERNAL_AUDIT', 'true'
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Stable published build, October 21, 2026. Update after testing.
    implementation 'org.mozilla.geckoview:geckoview:159.0.20261022150525'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}

dependencyLocking { lockAllConfigurations() }

// Public inventory contains coordinates/hashes only, never developer paths.
tasks.register('runtimeInventory') {
    def target = layout.buildDirectory.file('reports/runtime-inventory.json')
    outputs.file(target)
    doLast {
        def entries = configurations.releaseRuntimeClasspath.resolvedConfiguration.resolvedArtifacts.collect { a ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            a.file.withInputStream { input ->
                byte[] buffer = new byte[65536]
                int count
                while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
            }
            [coordinate: a.moduleVersion.id.toString(), artifact: a.file.name,
             sha256: digest.digest().encodeHex().toString()]
        }.sort { it.coordinate }
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(entries)) + '\n'
    }
}
