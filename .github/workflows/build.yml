name: Build and audit
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify wrapper
        run: echo '238e777fcddd7e34f9708186085def2abd6e08e658505b38718d79d74c21abd5  gradle/wrapper/gradle-wrapper.jar' | sha256sum -c -
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '12266719'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK platforms
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Build without release signing keys
        run: ./gradlew --no-daemon --dependency-verification strict :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:runtimeInventory
      - name: Check unsigned payload
        run: node scripts/check-release.mjs app/build/outputs/apk/release/app-release-unsigned.apk --unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 14
